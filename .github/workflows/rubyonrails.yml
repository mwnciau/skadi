name: "Ruby on Rails CI"
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 1: Install ruby and run tests that don't depend on Rails

      - name: Install Ruby and gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.4"
          bundler-cache: true

      - name: Run rubocop rules
        run: bundle exec rubocop

      # Step 2: install JS dependencies, run biome rules and FE tests

      - name: Install js dependencies
        run: npm install

      - name: Run biome rules
        run: npx @biomejs/biome check

      # Step 3: Run the tests

      - name: Run tests
        run: bin/rails test

